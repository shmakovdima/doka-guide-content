<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="1200" height="630" fill="#0f1729"/>
  <rect width="1200" height="630" fill="url(#g)"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16213e"/>
      <stop offset="1" stop-color="#0f1729"/>
    </linearGradient>
  </defs>
  <text x="90" y="150" fill="#fff" font-size="60" font-weight="800">Статические генераторы</text>
  <text x="90" y="205" fill="#fff" font-size="60" font-weight="800">сайтов</text>
  <text x="92" y="250" fill="#8aa0c8" font-size="28">Astro, Next.js, Hugo, Eleventy и ещё дюжина инструментов</text>

  <!-- море статики с островами интерактивности -->
  <g transform="translate(90,300)">
    <rect x="0" y="0" width="1020" height="240" rx="16" fill="#1b2950"/>

    <!-- волны статики -->
    <g stroke="#2c3d6b" stroke-width="2" fill="none" opacity="0.6">
      <path d="M20,40 Q45,30 70,40 T120,40 T170,40"/>
      <path d="M20,200 Q45,190 70,200 T120,200 T170,200"/>
      <path d="M850,40 Q875,30 900,40 T950,40 T1000,40"/>
      <path d="M850,200 Q875,190 900,200 T950,200 T1000,200"/>
    </g>

    <!-- остров 1 -->
    <g transform="translate(60,60)">
      <rect x="0" y="0" width="260" height="120" rx="14" fill="#254a8a"/>
      <circle cx="230" cy="20" r="8" fill="#7cc4ff"/>
      <text x="24" y="50" fill="#7cc4ff" font-size="24" font-weight="700">client:load</text>
      <text x="24" y="85" fill="#9fb3d6" font-size="18" font-weight="400">интерактивный остров</text>
    </g>

    <!-- остров 2 -->
    <g transform="translate(380,30)">
      <rect x="0" y="0" width="260" height="120" rx="14" fill="#254a8a"/>
      <circle cx="230" cy="20" r="8" fill="#9ad07a"/>
      <text x="24" y="50" fill="#9ad07a" font-size="24" font-weight="700">client:visible</text>
      <text x="24" y="85" fill="#9fb3d6" font-size="18" font-weight="400">гидрация по скроллу</text>
    </g>

    <!-- остров 3 -->
    <g transform="translate(700,90)">
      <rect x="0" y="0" width="260" height="120" rx="14" fill="#254a8a"/>
      <circle cx="230" cy="20" r="8" fill="#f2b66d"/>
      <text x="24" y="50" fill="#f2b66d" font-size="24" font-weight="700">client:idle</text>
      <text x="24" y="85" fill="#9fb3d6" font-size="18" font-weight="400">гидрация в простое</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect width="1200" height="630" fill="#0f1729"/>
  <rect width="1200" height="630" fill="url(#g)"/>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16213e"/>
      <stop offset="1" stop-color="#0f1729"/>
    </linearGradient>
  </defs>
  <text x="90" y="150" fill="#fff" font-size="74" font-weight="800">Core Web Vitals</text>
  <text x="92" y="205" fill="#8aa0c8" font-size="30">Метрики, по которым Google оценивает ваш сайт</text>

  <!-- шкала зон -->
  <g transform="translate(90,300)">
    <rect x="0" y="0" width="340" height="64" rx="12" fill="#1f9d55"/>
    <rect x="356" y="0" width="340" height="64" rx="12" fill="#d9a514"/>
    <rect x="712" y="0" width="340" height="64" rx="12" fill="#d64545"/>
    <text x="170" y="40" fill="#fff" font-size="26" font-weight="700" text-anchor="middle">Хорошо</text>
    <text x="526" y="40" fill="#1a1206" font-size="26" font-weight="700" text-anchor="middle">Нужно улучшить</text>
    <text x="882" y="40" fill="#fff" font-size="26" font-weight="700" text-anchor="middle">Плохо</text>
  </g>

  <!-- три основные метрики -->
  <g transform="translate(90,430)" font-weight="800">
    <rect x="0" y="0" width="330" height="120" rx="16" fill="#1b2950"/>
    <text x="28" y="55" fill="#7cc4ff" font-size="44">LCP</text>
    <text x="28" y="95" fill="#9fb3d6" font-size="22" font-weight="400">загрузка ≤ 2,5 с</text>

    <rect x="361" y="0" width="330" height="120" rx="16" fill="#1b2950"/>
    <text x="389" y="55" fill="#9ad07a" font-size="44">INP</text>
    <text x="389" y="95" fill="#9fb3d6" font-size="22" font-weight="400">отклик ≤ 200 мс</text>

    <rect x="722" y="0" width="330" height="120" rx="16" fill="#1b2950"/>
    <text x="750" y="55" fill="#f2b66d" font-size="44">CLS</text>
    <text x="750" y="95" fill="#9fb3d6" font-size="22" font-weight="400">сдвиг ≤ 0,1</text>
  </g>
</svg>
